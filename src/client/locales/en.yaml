home:
  hero: "Meet eggrollpos — no more overpaying for complicated restaurant tech you don't need"
  heroSubtext: "Built for small restaurants that just want to cook great food without all the hassle."
  heroCTA: "Get Early Access"
  featuresTitle: "Everything you need to run your quick service restaurant, popup stall, Chinese takeout, food cart, and everything in between"
  feature1Title: "Merchant Dashboard"
  feature1Desc: "Accept, prepare, and fulfill orders in real-time. Track order status from a single screen."
  feature2Title: "Digital Menu Management"
  feature2Desc: "Create multiple menus. Add items, set prices, create modifiers and add-ons. Your menu, your way."
  feature3Title: "Online Ordering"
  feature3Desc: "Customers browse your menu and place orders from any device. No app download needed."
  feature4Title: "WhatsApp Ordering"
  feature4Desc: "Meet customers where they are. Take orders, send confirmations, and share receipts — all through WhatsApp."
  feature5Title: "Bring your own Payment"
  feature5Desc: "Use GrabPay, DuitNow QR, Alipay, PayPal, Cash App, or any processor you already have. No extra commission fees."
  feature6Title: "Receipts & Tracking"
  feature6Desc: "Auto-generated receipts with tax and totals. Customers track their order status in real time."
  feature7Title: "QR Code Ordering"
  feature7Desc: "Print a QR code. Customers scan, browse your menu, and order from their phone — no app needed."
  feature8Title: "Multi-language"
  feature8Desc: "English, Chinese, and more. Your customers and staff use the app in their preferred language."
  feature9Title: "Open Source & Self-Hosted Option"
  feature9Desc: "Full data ownership. Deploy on your own servers. No vendor lock-in, 100% freedom to choose"
  pricingTitle: "Simple, transparent pricing"
  pricingSubtext: "Get started with no fees, then only pay for what additional orders you get and up to $15/mo maximum"
  pricingFreeTitle: "Free"
  pricingFreeOrders: "Up to <strong>300</strong> online orders / month"
  pricingFreeCta: "Sign up"
  pricingGrowthTitle: "Growth"
  pricingGrowthOrders: "<strong>$0.05</strong> per online order beyond 300, or max <strong>$15</strong>/mo<br/><span style=\"font-size:0.9rem;color:#adb5bd;\">Example: 500 orders = 300 free + 200 × $0.05 = $10/mo. 600+ orders = $15/mo.</span>"
  pricingGrowthCta: "Sign up"
  pricingIncludes: "Every plan includes"
  pricingFeature1: "Online order menu"
  pricingFeature2: "WhatsApp integration"
  pricingFeature3: "Merchant POS dashboard"
  pricingFeature4: "Bring your own payment processor"
  pricingFeature5: "Self-hosted — your server, your data"
  pricingFeature6: "No monthly fees, no commissions"
  pricingHardwareNote: "Hardware needs to be purchased separately"
  aboutQuote: "We are building eggrollpos with the belief that restaurant tech should be simple and affordable for shops of all sizes and budgets, not just the big players. Whether you are a small Chinese takeout in Philly, a nasi lemak stall on the outskirts of JB, a coffee roaster upstart in Xiamen, or a breakfast taco food truck in Austin. The technology should get out of the way as not something that needs to be operated and managed, but exist in the background doing the tedious work while you focus on great food and drinks. eggrollpos is not designed to manage complex restaurant operations with dozens of staff and payrolls, but for the mom and pop entrepreneurs, pioneers, and craftspeople that make great food."
