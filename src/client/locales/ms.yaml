home:
  hero: "Kenali eggrollpos — jangan bayar lebih untuk sistem restoran yang rumit dan tak diperlukan"
  heroSubtext: "Dibina khas untuk restoran kecil, gerai, dan peniaga makanan yang hanya mahu masak dengan hebat — tanpa pening kepala."
  heroCTA: "Dapatkan Akses Awal"
  featuresTitle: "Semua yang anda perlukan untuk mengurus restoran servis pantas, gerai popup, kedai Cina, trak makanan, dan segalanya"
  feature1Title: "Papan Pemuka Peniaga"
  feature1Desc: "Terima, sediakan, dan selesaikan pesanan secara langsung. Pantau semua status pesanan dari satu skrin."
  feature2Title: "Pengurusan Menu Digital"
  feature2Desc: "Cipta pelbagai menu. Tambah item, tetapkan harga, cipta modifier dan tambahan. Menu anda, ikut cara anda."
  feature3Title: "Pesanan Dalam Talian"
  feature3Desc: "Pelanggan boleh lihat menu dan buat pesanan dari mana-mana peranti. Tak perlu muat turun aplikasi."
  feature4Title: "Pesanan WhatsApp"
  feature4Desc: "Jumpa pelanggan di mana mereka berada. Ambil pesanan, hantar pengesahan, dan kongsi resit — semuanya melalui WhatsApp."
  feature5Title: "Guna Pembayaran Sendiri"
  feature5Desc: "Pakai GrabPay, DuitNow QR, PayNow, Alipay, atau mana-mana pemproses pembayaran yang anda sudah guna. Tiada komisen tambahan."
  feature6Title: "Resit & Penjejakan"
  feature6Desc: "Resit dijana automatik lengkap dengan cukai dan jumlah. Pelanggan boleh kesan status pesanan secara langsung."
  feature7Title: "Pesanan Kod QR"
  feature7Desc: "Cetak kod QR. Pelanggan imbas, lihat menu, dan pesan dari telefon — tak perlu aplikasi."
  feature8Title: "Pelbagai Bahasa"
  feature8Desc: "Inggeris, Cina, dan banyak lagi. Pelanggan dan kakitangan anda guna aplikasi dalam bahasa pilihan masing-masing."
  feature9Title: "Sumber Terbuka & Pilihan Hos Sendiri"
  feature9Desc: "Kawalan penuh ke atas data anda. Pasang di pelayan sendiri. Tiada kunci vendor, 100% kebebasan memilih"
  pricingTitle: "Harga ringkas dan telus"
  pricingSubtext: "Bermula tanpa yuran, hanya bayar untuk pesanan tambahan sehingga maksimum RM 40/bulan"
  pricingFreeTitle: "Percuma"
  pricingFreeOrders: "Sehingga <strong>300</strong> pesanan dalam talian / bulan"
  pricingFreeCta: "Daftar untuk diberitahu"
  pricingGrowthTitle: "Pertumbuhan"
  pricingGrowthOrders: "<strong>RM 0.10</strong> setiap pesanan selepas 300, atau maks <strong>RM 40</strong>/bulan<br/><span style=\"font-size:0.9rem;color:#adb5bd;\">Contoh: 500 pesanan = 300 percuma + 200 × RM 0.10 = RM 20/bulan. 700+ pesanan = RM 40/bulan.</span>"
  pricingGrowthCta: "Daftar untuk diberitahu"
  pricingIncludes: "Setiap pelan termasuk"
  pricingFeature1: "Menu pesanan dalam talian"
  pricingFeature2: "Integrasi WhatsApp"
  pricingFeature3: "Papan pemuka POS peniaga"
  pricingFeature4: "Guna pemproses pembayaran sendiri"
  pricingFeature5: "Hos sendiri — pelayan anda, data anda"
  pricingFeature6: "Tiada yuran bulanan, tiada komisen"
  pricingHardwareNote: "Perkakasan perlu dibeli secara berasingan"
  aboutQuote: "Kami membangunkan eggrollpos dengan keyakinan bahawa teknologi restoran harus ringkas dan mampu milik untuk kedai dari semua saiz dan bajet, bukan hanya pemain besar. Sama ada anda sebuah kedai Cina kecil di Philly, gerai nasi lemak di pinggir JB, pemula penggoreng kopi di Xiamen, atau trak makanan taco sarapan di Austin. Teknologi sepatutnya tidak menghalang — bukan sesuatu yang perlu dikendalikan dan diuruskan secara rumit, sebaliknya wujud di latar belakang melakukan kerja-kerja remeh sementara anda fokus pada makanan dan minuman yang hebat. eggrollpos bukan direka untuk mengurus operasi restoran kompleks dengan puluhan kakitangan dan gaji, tetapi untuk usahawan makcik pakcik, perintis, dan tukang masak yang menghasilkan makanan hebat."
  betaTitle: "Daftar dengan nama, emel atau telefon dan butiran restoran — kami akan hubungi anda apabila sedia"
  contactName: "Nama"
  contactNamePlaceholder: "Ahmad bin Ismail"
  contactEmail: "Emel atau Telefon"
  contactEmailPlaceholder: "anda@emel.com atau +60123456789"
  contactDescription: "Terangkan restoran atau kafe anda"
  submit: "Hantar"

